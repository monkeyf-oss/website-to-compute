<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-Chat Universe</title>
  <style>
    body { font-family:'Arial',sans-serif; background:#f0f2f5; margin:0; padding:0 }
    header { background:#ff69b4; color:white; text-align:center; padding:1rem; font-size:1.5rem }
    #character-setup, #chat-box { max-width:600px; margin:2rem auto; padding:1rem; background:white; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1) }
    #chat-area { height:300px; overflow-y:auto; border:1px solid #ccc; padding:0.5rem; margin-bottom:1rem }
    .message { margin:0.5rem 0 }
    .user { text-align:right; color:#333 }
    .ai { text-align:left; color:#ff69b4 }
    input,button,select { padding:0.5rem; margin-top:0.5rem; width:100%; box-sizing:border-box; border-radius:5px; border:1px solid #ccc }
  </style>
</head>
<body>
  <header>K-Chat Universe 💬</header>

  <div id="character-setup">
    <h2>Create Your Idol Chat</h2>
    <input id="character-name" placeholder="Character Name (e.g., Jungwon)" />
    <select id="character-personality">
      <option value="sweet">Sweet</option>
      <option value="sassy">Sassy</option>
      <option value="mysterious">Mysterious</option>
    </select>
    <button onclick="startChat()">Start Chat</button>
  </div>

  <div id="chat-box" style="display:none;">
    <h3 id="chat-title"></h3>
    <div id="chat-area"></div>
    <input id="user-input" placeholder="Say something..." />
    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    let character = {};

    function startChat() {
      const name = document.getElementById('character-name').value.trim();
      const personality = document.getElementById('character-personality').value;
      if (!name) return alert('Please enter a name!');
      character = { name, personality };
      document.getElementById('chat-title').innerText = `Chatting with ${name}`;
      document.getElementById('character-setup').style.display = 'none';
      document.getElementById('chat-box').style.display = 'block';
      addMessage(`${name} joined the chat`, 'ai');
    }

    function sendMessage() {
      const input = document.getElementById('user-input');
      const msg = input.value;
      if (!msg.trim()) return;
      addMessage(msg, 'user');
      input.value = '';
      setTimeout(() => fakeAIResponse(msg), 800);
    }

    function addMessage(text, sender) {
      const div = document.createElement('div');
      div.className = `message ${sender}`;
      div.innerText = text;
      const chatArea = document.getElementById('chat-area');
      chatArea.appendChild(div);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function fakeAIResponse(userMsg) {
      const replies = {
        sweet: ["Aww that's so cute! 💖", "You're the best, really. 😚", "Hehe, you're making me blush~ 😳"],
        sassy: ["Pfft, is that all you got? 😏", "Try again, bestie. 🖐", "You're lucky you're cute. 🙄"],
        mysterious: ["Hmm... interesting. 👀", "Maybe one day, you'll know the truth. 🤫", "I have secrets you can't imagine. 🌌"]
      };
      const options = replies[character.personality];
      const reply = options[Math.floor(Math.random()*options.length)];
      addMessage(reply, 'ai');
    }
  </script>
</body>
</html>
